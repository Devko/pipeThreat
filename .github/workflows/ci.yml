# CI: prove the package installs and runs straight from the repo.
name: ci

on:
  push:
  pull_request:

# Least privilege — this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref instead of piling up matrix builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev extras)
        run: pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

      - name: Validate the example baseline (baseline-as-code guard)
        run: threat-delta validate --baseline examples/threat-model.yaml

      - name: Smoke-test the CLI on the bundled example
        # --llm stub: offline, deterministic dry-run (no model server on the CI
        # runner); this checks the CLI wiring + SARIF shape, not model output.
        run: |
          threat-delta \
            --baseline examples/threat-model.yaml \
            --diff examples/pr-1234.diff \
            --annotations examples/pr-1234.annotations.json \
            --pr 1234 \
            --llm stub \
            --sarif "$RUNNER_TEMP/out.sarif" \
            --comment "$RUNNER_TEMP/out.md"
          python -c "import json,sys; d=json.load(open('$RUNNER_TEMP/out.sarif')); assert d['version']=='2.1.0'; print('SARIF OK')"
