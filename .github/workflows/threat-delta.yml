# Example consumer workflow for the Threat-Model Delta step, driven by the
# composite action in this repo (uses: ./). In another repository, replace
# `uses: ./` with `uses: Devko/pipeThreat@main` (or a pinned tag).
#
# The step is advisory (spec §9): it never fails the build on its own. The job
# uploads SARIF and posts the PR comment.
name: threat-model-delta

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  threat-delta:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory: never block the merge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so the action can compute the PR diff

      - name: Threat-Model Delta
        id: delta
        uses: ./ # in a consumer repo: uses: Devko/pipeThreat@main
        with:
          baseline: examples/threat-model.yaml # consumer default: threat-model.yaml
          # llm: stub is the default (deterministic only, no model). For real
          # 6b/6c/6d signal, provision a local Gemma on the runner:
          #   llm: ollama
          #   llm-model: gemma4:e4b  # ~9.6GB, cached; runs on the CPU runner
          llm: stub

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.delta.outputs.sarif }}
          category: threat-model-delta

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ steps.delta.outputs.comment }}', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
