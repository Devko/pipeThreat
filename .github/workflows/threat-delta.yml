# Example consumer workflow for the Threat-Model Delta analysis, driven by the
# composite action in this repo (uses: ./). In another repository, replace
# `uses: ./` with `uses: Devko/pipeThreat@main` (or a pinned tag).
#
# The analysis is advisory: it never fails the build on its own. The job
# uploads SARIF and posts the PR comment.
name: threat-model-delta

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

# One run per PR; a new push cancels the in-flight (model-provisioning) run.
concurrency:
  group: threat-model-delta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  threat-delta:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory: never block the merge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so the action can compute the PR diff

      - name: Threat-Model Delta
        id: delta
        uses: ./ # in a consumer repo: uses: Devko/pipeThreat@main
        with:
          baseline: examples/threat-model.yaml # consumer default: threat-model.yaml
          # llm is required — the step will not run without a chosen model.
          # 'ollama' provisions a local Gemma on the CPU runner (~7.2GB, reasoning
          # on by default). Use 'openai' to target an existing endpoint, or 'stub'
          # for an offline dry-run that reports nothing (testing only).
          llm: ollama
          llm-model: gemma4:e2b

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.delta.outputs.sarif }}
          category: threat-model-delta

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ steps.delta.outputs.comment }}', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
