# Manually-triggered smoke test: run the Synapse worked example against a real
# local Gemma (Ollama) on a CPU runner — the one path unit tests can't cover.
# Trigger from the Actions tab or via the API.
name: gemma-smoke

on:
  workflow_dispatch:
    inputs:
      example:
        description: "which worked example to run"
        type: choice
        options: [synapse, vault, n8n]
        default: synapse
      model:
        description: "Ollama model to run (e.g. gemma4:e2b, gemma4:e4b)"
        required: false
        default: "gemma4:e2b"
      think:
        description: "model reasoning (on by default; best for e2b)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: gemma-smoke-${{ github.ref }}-${{ github.event.inputs.example }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # A local model on a CPU runner is slow; give generous headroom.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install threat-delta
        run: pip install -e .

      - name: Free disk space
        # Reclaim ~12GB+ for the model by removing unused preinstalled toolchains.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      # The model is re-pulled each run (a multi-GB model is too large for
      # GitHub's 10GB cache); for fast repeated runs use a self-hosted runner.
      - name: Provision Ollama + model
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          # The installer starts ollama as a systemd service; wait for it.
          for i in $(seq 1 30); do
            curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          echo "Pulling ${{ github.event.inputs.model }} ..."
          ollama pull "${{ github.event.inputs.model }}"
          ollama list
          # Warm up so the model is resident before the first (timed) analysis call.
          echo "Warming up ${{ github.event.inputs.model }} ..."
          ollama run "${{ github.event.inputs.model }}" "Reply with the single word: OK" >/dev/null 2>&1 || true

      - name: Run the Synapse sample against live Gemma
        run: |
          set -euo pipefail
          FLAG=""  # reasoning is on by default
          if [ "${{ github.event.inputs.think }}" = "false" ]; then FLAG="--no-think"; fi
          case "${{ github.event.inputs.example }}" in
            vault) DIR=examples/vault; STEM=pr-debug-inspect;  PR=29101 ;;
            n8n)   DIR=examples/n8n;   STEM=pr-public-trigger; PR=8421  ;;
            *)     DIR=examples/synapse; STEM=pr-account-export; PR=17421 ;;
          esac
          echo "Example: ${{ github.event.inputs.example }} ($DIR) · reasoning: ${FLAG:-on}"
          threat-delta analyze \
            --baseline "$DIR/threat-model.yaml" \
            --diff "$DIR/$STEM.diff" \
            --annotations "$DIR/$STEM.annotations.json" \
            --pr "$PR" \
            --llm ollama --llm-model "${{ github.event.inputs.model }}" $FLAG \
            --sarif "$RUNNER_TEMP/threat-delta.sarif" \
            --comment "$RUNNER_TEMP/threat-delta.md" \
            --json "$RUNNER_TEMP/deltas.json" | tee "$RUNNER_TEMP/stdout.txt"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Live smoke result — ${{ github.event.inputs.example }} · ${{ github.event.inputs.model }}"
            echo
            echo "### Model server log (tail)"
            echo '```'
            tail -n 20 "$RUNNER_TEMP/ollama.log" 2>/dev/null || echo "(no log)"
            echo '```'
            echo "### Generated PR comment"
            echo
            cat "$RUNNER_TEMP/threat-delta.md" 2>/dev/null || echo "(no comment produced)"
            echo
            echo "### Delta count"
            python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/deltas.json')); print(len(d['deltas']), 'deltas')" 2>/dev/null || echo "n/a"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma-smoke-report
          path: |
            ${{ runner.temp }}/threat-delta.sarif
            ${{ runner.temp }}/threat-delta.md
            ${{ runner.temp }}/deltas.json
