# Composite GitHub Action — integrate the Threat-Model Delta step directly from
# this repo with one line in a consumer workflow:
#
#   - uses: Devko/pipeThreat@main
#     with:
#       baseline: threat-model.yaml
#
# It installs the package from *this action's own checkout* (no network/git
# install needed), resolves the PR diff if one isn't supplied, runs the step, and
# exposes the SARIF + comment as outputs for the caller to upload/post.
name: "Threat-Model Delta"
description: "Advisory, non-blocking threat-model delta analysis for a pull request (pipeline step 6)."
author: "pipeThreat"
branding:
  icon: shield
  color: purple

inputs:
  baseline:
    description: "Path to the threat-model.yaml baseline (in the consumer repo)."
    required: false
    default: "threat-model.yaml"
  diff:
    description: "Path to a unified/structured diff. If empty, it is computed from the PR base ref."
    required: false
    default: ""
  base-ref:
    description: "Git ref to diff HEAD against when computing the diff. Defaults to the PR base branch."
    required: false
    default: ""
  annotations:
    description: "Path to step-5 annotations JSON (optional)."
    required: false
    default: ""
  findings:
    description: "Path to step 2-4 findings JSON (optional)."
    required: false
    default: ""
  pr:
    description: "PR number/identifier. Defaults to the triggering pull request."
    required: false
    default: ""
  fail-on-high:
    description: "If 'true', exit non-zero when a high-severity delta needs human review (optional gate)."
    required: false
    default: "false"
  max-hunk-chars:
    description: "Per-component hunk budget for the STRIDE call."
    required: false
    default: "4000"
  llm:
    description: >-
      LLM transport: 'stub' (default — deterministic only, no model) or 'ollama'
      (provision a local Gemma-class model on the runner for real 6b/6c/6d signal).
    required: false
    default: "stub"
  llm-model:
    description: "Ollama model to pull/run when llm=ollama (CPU-friendly ~4B)."
    required: false
    default: "gemma4:e4b"
  python-version:
    description: "Python version to set up."
    required: false
    default: "3.11"

outputs:
  sarif:
    description: "Path to the generated SARIF 2.1.0 file."
    value: ${{ steps.run.outputs.sarif }}
  comment:
    description: "Path to the generated PR-comment markdown."
    value: ${{ steps.run.outputs.comment }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install threat-delta (from this action's repo)
      shell: bash
      run: pip install "${{ github.action_path }}"

    # --- Optional: provision a local Gemma model on the runner ------------- #
    # Only runs when llm=ollama. A ~4B model runs on the CPU-only GitHub runner —
    # slow per call, but the step makes only 3-5 calls per PR and is
    # async/non-blocking (spec's "CPU-only CI runner, ~4B"). The model is re-pulled
    # each run: a 9.6GB model is too large to cache reliably (near GitHub's 10GB
    # cache limit). For fast repeated runs use a self-hosted runner with the model
    # pre-pulled, or point --llm openai at an existing endpoint.
    - name: Free disk space
      if: ${{ inputs.llm == 'ollama' }}
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
        df -h /

    - name: Provision Ollama + model
      if: ${{ inputs.llm == 'ollama' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v ollama >/dev/null 2>&1; then
          curl -fsSL https://ollama.com/install.sh | sh
        fi
        # The installer starts ollama as a systemd service; wait for it.
        for i in $(seq 1 30); do
          curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1 && break
          sleep 1
        done
        ollama pull "${{ inputs.llm-model }}"
        # Warm up so the model is resident before the first (timed) analysis call.
        ollama run "${{ inputs.llm-model }}" "Reply with the single word: OK" >/dev/null 2>&1 || true

    - name: Resolve PR diff
      id: diff
      shell: bash
      run: |
        set -euo pipefail
        DIFF_PATH="${{ inputs.diff }}"
        if [ -z "$DIFF_PATH" ]; then
          BASE="${{ inputs.base-ref }}"
          if [ -z "$BASE" ]; then BASE="origin/${{ github.base_ref }}"; fi
          DIFF_PATH="${RUNNER_TEMP:-/tmp}/threat-delta-pr.diff"
          echo "Computing diff: git diff ${BASE}...HEAD"
          git diff "${BASE}...HEAD" > "$DIFF_PATH" || git diff "${BASE}" HEAD > "$DIFF_PATH"
        fi
        echo "path=$DIFF_PATH" >> "$GITHUB_OUTPUT"

    - name: Run threat-model delta
      id: run
      shell: bash
      run: |
        set -euo pipefail
        OUT="${RUNNER_TEMP:-/tmp}"
        PR="${{ inputs.pr }}"
        if [ -z "$PR" ]; then PR="${{ github.event.pull_request.number }}"; fi
        ARGS=(--baseline "${{ inputs.baseline }}"
              --diff "${{ steps.diff.outputs.path }}"
              --pr "$PR"
              --max-hunk-chars "${{ inputs.max-hunk-chars }}"
              --llm "${{ inputs.llm }}"
              --sarif "$OUT/threat-delta.sarif"
              --comment "$OUT/threat-delta.md")
        if [ "${{ inputs.llm }}" = "ollama" ]; then ARGS+=(--llm-model "${{ inputs.llm-model }}"); fi
        if [ -n "${{ inputs.annotations }}" ]; then ARGS+=(--annotations "${{ inputs.annotations }}"); fi
        if [ -n "${{ inputs.findings }}" ]; then ARGS+=(--findings "${{ inputs.findings }}"); fi
        if [ "${{ inputs.fail-on-high }}" = "true" ]; then ARGS+=(--fail-on-high); fi
        threat-delta "${ARGS[@]}"
        echo "sarif=$OUT/threat-delta.sarif" >> "$GITHUB_OUTPUT"
        echo "comment=$OUT/threat-delta.md" >> "$GITHUB_OUTPUT"
