[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-delta"
version = "0.1.0"
description = "Pipeline Step 6 — Threat-Model Delta Analysis (advisory, CPU-only, local ~4B LLM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
threat-delta = "threat_delta.cli:main"

[tool.setuptools]
packages = ["threat_delta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
