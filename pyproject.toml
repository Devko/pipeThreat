[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-delta"
version = "0.1.0"
description = "Threat-Model Delta Analysis — advisory, CPU-only, local-LLM PR threat review"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
threat-delta = "threat_delta.cli:main"

[tool.setuptools]
packages = ["threat_delta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
